[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fets2022-flower"
version = "0.1.0"
description = "FeTS 2022 3D MRI federated segmentation with Flower"
license = {text = "Apache-2.0"}
dependencies = [
    "flwr[simulation]>=1.13.0",
    "torch>=2.1.0",
    "monai>=1.3.0",
    "nibabel>=5.2.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "researcher"
fab-format-version = 1
flwr-version-target = "1.31.0"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
data-root = "E:/rnds/MICCAI_FeTS2022_TrainingData/MICCAI_FeTS2022_TrainingData"
partition-csv = "E:/rnds/MICCAI_FeTS2022_TrainingData/MICCAI_FeTS2022_TrainingData/partitioning_1.csv"
output-dir = "artifacts"
num-clients = 23
num-server-rounds = 5
local-epochs = 1
batch-size = 1
learning-rate = 0.0001
fraction-train = 1.0
fraction-evaluate = 1.0
algorithm = "fedavg"
proximal-mu = 0.01
cache-rate = 0.0
seed = 42
device = "cpu"
num-workers = 0
model_name = "unet"
dataset_name = "fets2022"
save-model = false
min-available-clients = 2

[partition]
type = "iid"
alpha = 0.5
num_shards = 2
